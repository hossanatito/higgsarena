# Local development:   docker compose up -d db
# Production (VPS):    docker compose --profile production up -d --build
name: higgsarena

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: higgsarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-higgsarena}
      POSTGRES_DB: higgsarena
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only. Never published to the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U higgsarena -d higgsarena"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["production"]
    build: .
    image: higgsarena:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://higgsarena:${POSTGRES_PASSWORD:-higgsarena}@db:5432/higgsarena
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    # Not published: only Caddy talks to the app.
    expose:
      - "3000"

  caddy:
    profiles: ["production"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (run pnpm run setup --production)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  cron:
    profiles: ["production"]
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    # Calls the sweep every minute: finishes stuck jobs, mirrors outputs, expires overrides.
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while true; do
               curl -fsS -m 240 -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/sweep >/dev/null || echo 'sweep failed';
               sleep 60;
             done"
    depends_on:
      - app

  backup:
    profiles: ["production"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-higgsarena}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    # Nightly pg_dump with 14-day rotation (see README → Backups).
    command: sh -c "while true; do sh /backup.sh || echo 'backup failed'; sleep 86400; done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
