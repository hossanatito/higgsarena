name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: higgsarena
          POSTGRES_PASSWORD: higgsarena
          POSTGRES_DB: higgsarena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U higgsarena" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://higgsarena:higgsarena@127.0.0.1:5432/higgsarena
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Configure test environment
        run: |
          pnpm run setup
          sed -i 's/^DEMO_MODE=.*/DEMO_MODE=true/; s/^OWNER_EMAILS=.*/OWNER_EMAILS=owner@demo.local/; s/^HF_API_KEY_ID=.*/HF_API_KEY_ID=ci-key/; s/^HF_API_KEY_SECRET=.*/HF_API_KEY_SECRET=ci-secret-value-for-leak-check/' .env
          echo "HF_API_BASE_URL=http://127.0.0.1:4010" >> .env
      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
      - name: Build
        run: pnpm build
      - name: Secret-leak check (client bundle)
        run: pnpm check:secrets
      - name: Secret-leak check (live pages and API responses)
        # The production server refuses demo users and http URLs by design, so
        # the crawl runs against the dev server with the seeded demo accounts.
        run: |
          pnpm mock:higgsfield &
          pnpm dev &
          npx wait-on -t 120000 http://127.0.0.1:3000/api/health
          BASE_URL=http://localhost:3000 pnpm check:secrets

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
